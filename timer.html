<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Last Call Physical Copy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Work+Sans:wght@500;600;700&display=swap">
<style>
/* Physical copy companion: round number, a timer and a talk/silent switch. Everything else lives on the board. */
:root{
  --night:#1b2033; --panel:#252d45; --line:#3d4868; --ink:#2a2433; --muted:#a9b0c6; --text:#f3eee4;
  --gold:#f2c14e; --red:#e2574c;
  --f-display:'Josefin Sans',system-ui,sans-serif; --f-body:'Work Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--text);margin:0;min-height:100%}
body{font-family:var(--f-body);font-size:16px;padding:0 max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:14px}
button:focus-visible,a:focus-visible,input:focus-visible+.track{outline:3px solid var(--gold);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;color:var(--gold)}
.tabs{display:flex;gap:4px;background:var(--panel);padding:3px;border-radius:10px}
.tabs a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;padding:6px 12px;border-radius:8px}
.tabs a[aria-current]{background:var(--gold);color:var(--ink)}
.spacer{flex:1}
.toplink{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
main{max-width:560px;margin:0 auto;padding-top:clamp(24px,6vh,64px);display:grid;gap:clamp(20px,4vh,36px);text-align:center}
.round{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1}
.round b{color:var(--gold)}
.clock{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(96px,30vw,180px);line-height:1;letter-spacing:.02em}
.clock.hot{color:var(--red)}
.switch{display:inline-flex;align-items:center;gap:14px;justify-self:center;cursor:pointer;font-weight:600;font-size:18px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:64px;height:36px;border-radius:999px;background:var(--panel);border:2px solid var(--line);position:relative;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch input:checked+.track{background:var(--red);border-color:var(--red)}
.switch input:checked+.track::after{transform:translateX(28px)}
.switch .off,.switch .on{color:var(--muted)}
.switch:not(:has(input:checked)) .off,.switch:has(input:checked) .on{color:var(--text)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--ink);font-weight:700;padding:16px 28px;font-size:20px;min-width:150px}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.ring{position:fixed;inset:0;z-index:20;background:#8e2632;display:grid;place-items:center;text-align:center;padding:24px;animation:flash .9s steps(2) infinite}
.ring h2{font-family:var(--f-display);font-size:clamp(48px,14vw,96px);margin:0 0 24px;color:#fff}
@keyframes flash{50%{background:#6e1c27}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">LAST CALL</div>
  <nav class="tabs" aria-label="Playtest pages"><a href="./">Online game</a><a href="timer.html" aria-current="page">Physical copy</a></nav>
  <div class="spacer"></div>
  <a class="toplink" href="rulebook.pdf" target="_blank" rel="noopener">Rules (PDF)</a>
</header>
<main>
  <div class="round" id="round" aria-live="polite">Round <b>1</b> of 8</div>
  <div class="clock" id="clock">1:00</div>
  <label class="switch"><span class="off">Talk freely</span><input type="checkbox" id="silent" aria-label="Silent planning"><span class="track"></span><span class="on">Silent</span></label>
  <div class="row"><button class="btn" id="startBtn">Start</button><button class="btn ghost" id="resetBtn">Reset</button></div>
  <div class="row"><button class="btn ghost" id="prevBtn">Back</button><button class="btn ghost" id="nextBtn">Next round</button></div>
</main>
<div class="ring" id="ring" hidden role="alertdialog" aria-labelledby="ringTitle"><div><h2 id="ringTitle">Time's up!</h2><button class="btn" id="ringStop">OK</button></div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const get = (k, d) => { try { const v = localStorage.getItem('lcs_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const put = (k, v) => { try { localStorage.setItem('lcs_' + k, JSON.stringify(v)); } catch (e) {} };
  let round = get('round', 1), silent = false, left = 60, running = false, endAt = 0, tickH = null, ringH = null, ac = null, lock = null;
  const duration = () => silent ? 30 : 60;
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  function draw() {
    $('round').innerHTML = `Round <b>${round}</b> of 8`;
    $('clock').textContent = fmt(left); $('clock').className = 'clock' + (left <= 10 ? ' hot' : '');
    $('startBtn').textContent = running ? 'Pause' : (left < duration() && left > 0 ? 'Resume' : 'Start');
    $('silent').checked = silent;
    $('prevBtn').disabled = round === 1;
    $('nextBtn').textContent = round === 8 ? 'New night' : 'Next round';
  }
  function stop() { running = false; clearInterval(tickH); }
  function reset() { stop(); left = duration(); draw(); }
  function start() {
    if (left <= 0) left = duration();
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    try { if ('wakeLock' in navigator && !lock) navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => lock = null); }); } catch (e) {}
    running = true; endAt = Date.now() + left * 1000; clearInterval(tickH);
    tickH = setInterval(() => { left = (endAt - Date.now()) / 1000; if (left <= 0) { left = 0; stop(); ring(); } draw(); }, 200); draw();
  }
  function tone(f, at) { try { const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.15); } catch (e) {} }
  const bell = () => { for (let i = 0; i < 4; i++) { tone(1320, i * 0.14); tone(990, i * 0.14 + 0.07); } };
  function ring() {
    $('ring').hidden = false; bell(); let n = 0;
    try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
    clearInterval(ringH); ringH = setInterval(() => (++n >= 6 ? stopRing() : bell()), 1300); $('ringStop').focus();
  }
  function stopRing() { clearInterval(ringH); $('ring').hidden = true; left = duration(); draw(); }
  function goRound(r) { round = r; put('round', round); silent = false; reset(); }

  $('startBtn').onclick = () => { running ? stop() : start(); draw(); };
  $('resetBtn').onclick = reset;
  $('silent').onchange = e => { silent = e.target.checked; reset(); };
  $('nextBtn').onclick = () => goRound(round === 8 ? 1 : round + 1);
  $('prevBtn').onclick = () => goRound(Math.max(1, round - 1));
  $('ringStop').onclick = stopRing;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ring').hidden) stopRing(); });
  reset();
})();
</script>
</body>
</html>
